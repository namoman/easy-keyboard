name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: EasyKeyboard ${{ github.ref_name }}
          releaseBody: |
            Windows x64 build.
            Verify SHA-256 digests attached below / in attestation.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: SHA-256 digests
        shell: pwsh
        run: |
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Recurse -File |
              ForEach-Object {
                $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                "$hash  $($_.Name)"
              } | Tee-Object -FilePath checksums-sha256.txt
          } else {
            "no bundle dir" | Tee-Object -FilePath checksums-sha256.txt
          }

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-sha256
          path: checksums-sha256.txt

      - name: Attest build artifacts
        if: hashFiles('src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
